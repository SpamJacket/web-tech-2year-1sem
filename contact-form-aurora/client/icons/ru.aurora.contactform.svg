<?xml version="1.0" encoding="UTF-8"?>
<svg width="172" height="172" viewBox="0 0 172 172" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="86" cy="86" r="80" fill="#2E7D32"/>
  
  <!-- Envelope body -->
  <rect x="36" y="56" width="100" height="70" rx="8" ry="8" fill="#FFFFFF"/>
  
  <!-- Envelope flap (triangle) -->
  <polygon points="36,56 86,96 136,56" fill="#E8F5E9" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Inner envelope lines -->
  <line x1="36" y1="56" x2="86" y2="96" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
  <line x1="136" y1="56" x2="86" y2="96" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Message lines inside envelope -->
  <line x1="50" y1="100" x2="90" y2="100" stroke="#81C784" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="112" x2="122" y2="112" stroke="#81C784" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Small decorative circle (send indicator) -->
  <circle cx="130" cy="42" r="16" fill="#4CAF50"/>
  <polygon points="124,42 136,42 130,34" fill="#FFFFFF"/>
  <rect x="128" y="42" width="4" height="10" fill="#FFFFFF"/>
</svg>

